# ScreenPilot full stack.
#   Everything:  docker compose up -d --build   ->  http://localhost:8090
#   DB only (for local ./mvnw + npm run dev):    docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: signage-postgres
    environment:
      POSTGRES_DB: signage
      POSTGRES_USER: signage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signage}
    ports:
      - "5433:5432"
    volumes:
      - signage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage -d signage"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: screenpilot-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/signage
      SPRING_DATASOURCE_USERNAME: signage
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-signage}
      APP_CORS_ALLOWED_ORIGINS: "*"
      # Required: signs JWTs and media links. Set in .env (see .env.example).
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET missing - copy .env.example to .env and set it}
    ports:
      - "8081:8081"
    volumes:
      # bind-mount so Docker and local-dev runs share the same media files
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # app + database round-trip; Docker restarts the container when it hangs
      test: ["CMD", "curl", "-sf", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: screenpilot-frontend
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Nightly pg_dump snapshots into ./backups, keeping 14 days.
  # One corrupted disk no longer means losing every schedule and report.
  backup:
    image: postgres:16-alpine
    container_name: screenpilot-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-signage}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do ts=$$(date +%Y-%m-%d_%H%M); if pg_dump -h postgres -U signage -d signage | gzip > /backups/signage-$$ts.sql.gz; then echo \"backup written: signage-$$ts.sql.gz\"; else echo 'backup FAILED'; fi; find /backups -name 'signage-*.sql.gz' -mtime +14 -delete; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  signage_pgdata:
