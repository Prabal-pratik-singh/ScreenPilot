server {
    listen 80;
    server_name _;

    # uploads up to the configured 500 MB limit (+ headroom)
    client_max_body_size 600m;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend container via Docker's internal DNS (127.0.0.11)
    # instead of caching its IP at startup — otherwise every backend redeploy
    # leaves nginx proxying to a dead IP (502s until nginx restarts).
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8081;

    # API -> Spring Boot
    # $http_host keeps the port so Spring sees browser requests as same-origin
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # WebSocket (STOMP + SockJS) -> Spring Boot
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # SPA routes (/, /screens, /player, ...) fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
